<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Web Dash</title>
    <link rel="stylesheet" href="styles.css">
	<!-- Web App Manifest -->
<link rel="manifest" href="/manifest.json">

<!-- PNG Favicon -->
<link rel="icon" type="image/png" href="images/favi.png">

</head>
<body>
    <!-- Sidebar Trigger Strip -->
    <div class="sidebar-trigger" id="sidebarTrigger"></div>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Dashboard</h2>
            <button class="close-btn" id="closeSidebar" aria-label="Close menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="sidebar-content">
            <div class="add-url-section">
                <h3>Add Website</h3>
                <div class="input-group">
                    <input type="text" id="urlName" placeholder="Name (e.g. Google)" autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="url" id="urlInput" placeholder="URL (e.g. https://google.com)" autocomplete="off">
                </div>
                <button class="btn btn-add" id="addUrlBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Website
                </button>
            </div>

            <div class="divider"></div>

            <div class="pages-section">
                <h3>Your Pages</h3>
                <div class="pages-list" id="pagesList"></div>
            </div>

            <div class="divider"></div>

            <div class="edit-section">
                <button class="btn btn-edit" id="editModeBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    Edit Mode
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Canvas -->
    <main class="canvas" id="canvas">
        <!-- Top Tabs Bar -->
        <div class="tabs-bar" id="tabsBar">
            <div class="tabs-nav" id="tabsNav">
                <button class="tab-arrow tab-arrow-left" id="tabArrowLeft" aria-label="Previous tabs">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <div class="tabs-window" id="tabsWindow"></div>
                <button class="tab-arrow tab-arrow-right" id="tabArrowRight" aria-label="Next tabs">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 6 15 12 9 18"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
            </div>
            <h2>No websites added yet</h2>
            <p>Swipe from the left edge or tap the side strip to open the menu and add your first website.</p>
        </div>

        <!-- Iframe container -->
        <div class="iframe-container" id="iframeContainer"></div>
    </main>

    <!-- Edit Mode Overlay -->
    <div class="edit-overlay" id="editOverlay">
        <div class="edit-header">
            <h2>Edit Layout</h2>
            <button class="btn btn-done" id="doneEditBtn">Done</button>
        </div>
        <div class="edit-grid" id="editGrid"></div>
    </div>

    <!-- Edit Page Modal -->
    <div class="modal-overlay" id="editPageModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>Edit Page</h3>
                <button class="close-btn modal-close-btn" id="closeEditModal" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="editPageName">Name</label>
                    <input type="text" id="editPageName" placeholder="Website name" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="editPageUrl">URL</label>
                    <input type="url" id="editPageUrl" placeholder="https://example.com" autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelEditPage">Cancel</button>
                <button class="btn btn-save" id="saveEditPage">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
